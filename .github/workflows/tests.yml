name: 测试

on:
  pull_request:
  push:
    # 只在默认分支上按 push 触发。功能分支由 pull_request 覆盖——
    # 两个都开着的话，开了 PR 的分支每推一次会跑两遍，白烧一倍 Actions 额度。
    branches:
      - claude/socialdatax-skills-install-lq5wx4
      - main

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # 项目零第三方依赖，不需要 pip install。
      # 全部测试离线运行，不需要任何 API Key。
      - name: 跑单元测试
        run: python3 -m unittest discover -s tests -t . -v
      - name: 检查扣子打包产物能生成
        run: python3 tools/build_coze_node.py > /dev/null
